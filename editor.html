<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERCHARGE — Editor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23091526'/%3E%3Cpath d='M18 3 L8 18 L14 18 L12 29 L24 12 L17 12 Z' fill='%23ffee00' stroke='%23ff8800' stroke-width='0.5'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0d14; color: #cdd; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

  #editor-root { display: grid; grid-template-columns: 240px 1fr 260px; grid-template-rows: 40px 1fr; grid-template-areas: "toolbar toolbar toolbar" "sidebar main inspector"; height: 100vh; width: 100vw; transition: grid-template-columns 0.15s ease-out; }
  /* Collapsed state: inspector column shrinks to 0, main expands. Content is
     display:none-d so nothing leaks into the freed space. A small tab on the
     right edge of the canvas lets the user re-open. */
  #editor-root.inspector-collapsed { grid-template-columns: 240px 1fr 0; }
  #editor-root.inspector-collapsed #inspector { display: none; }

  /* Toolbar */
  #toolbar { grid-area: toolbar; background: #0f1420; border-bottom: 1px solid #1c2436; display: flex; align-items: center; padding: 0 12px; gap: 12px; font-size: 12px; }
  #toolbar h1 { font-size: 13px; letter-spacing: 2px; color: #ffee00; margin-right: 12px; }
  #toolbar button { background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 4px 10px; cursor: pointer; font-size: 12px; font-family: monospace; }
  #toolbar button:hover:not(:disabled) { background: #26304a; }
  #toolbar button:disabled { opacity: 0.35; cursor: not-allowed; }
  #toolbar button.active { background: #ffee00; color: #0a0d14; border-color: #ffee00; font-weight: bold; }
  #toolbar button.primary { background: #223250; border-color: #44ccff; color: #cceeff; }
  #toolbar button.primary:hover:not(:disabled) { background: #2c4266; }
  #toolbar select { background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 4px 6px; font-size: 12px; font-family: monospace; min-width: 180px; }
  #toolbar .divider { width: 1px; height: 20px; background: #1c2436; }
  #toolbar label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #889; }
  #level-info { margin-left: auto; font-family: monospace; font-size: 11px; color: #779; }
  #save-flash { font-family: monospace; font-size: 11px; color: #44ff88; opacity: 0; transition: opacity .3s; margin-left: 8px; }
  #save-flash.show { opacity: 1; }
  #save-flash.err { color: #ff5566; }
  .dirty-star { color: #ff8800; margin-left: 4px; }

  /* Sidebar (asset browser) */
  #asset-browser { grid-area: sidebar; background: #0d1119; border-right: 1px solid #1c2436; overflow-y: auto; padding: 8px; }
  .ab-header h3 { font-size: 11px; letter-spacing: 2px; color: #557; padding: 4px 0 8px; }
  .ab-search { width: 100%; background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 6px; font-size: 12px; margin-bottom: 6px; font-family: monospace; }
  .ab-category { width: 100%; background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 4px; font-size: 12px; margin-bottom: 6px; font-family: monospace; }
  .ab-status { font-size: 10px; color: #557; padding: 4px 0; }
  .ab-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  /* touch-action:none + user-select:none prevent browsers from stealing the
     pointer for scroll/text-select/native-image-drag when Chief starts a
     drag from a thumbnail. Without these, Firefox in particular hijacks. */
  .ab-cell { background: #131826; border: 1px solid #1c2436; padding: 4px; cursor: grab; text-align: center; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .ab-cell:active { cursor: grabbing; }
  .ab-cell:hover { border-color: #ffee00; }
  .ab-cell.selected { border-color: #ffee00; background: #1a1f0a; }
  /* pointer-events:none makes the img transparent to mouse — drag events
     target the parent draggable cell instead of the child img, so HTML5
     drag-and-drop fires reliably (fixes Firefox drag-from-thumbnail bug). */
  .ab-thumb { width: 100%; height: 60px; object-fit: contain; image-rendering: pixelated; background: #0a0d14; pointer-events: none; }
  .ab-label { font-size: 9px; color: #779; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; font-family: monospace; pointer-events: none; }

  /* Main canvas */
  #main-area { grid-area: main; position: relative; overflow: hidden; background: #0a0d14; }
  #editor-canvas { display: block; width: 100%; height: 100%; }

  /* Inspector (Phase 3 placeholder) */
  #inspector { grid-area: inspector; background: #0d1119; border-left: 1px solid #1c2436; padding: 0; overflow-y: auto; }
  #inspector-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #1c2436; }
  #inspector-header h3 { font-size: 11px; letter-spacing: 2px; color: #557; padding: 0; }
  #inspector-header button { background: transparent; color: #557; border: 1px solid #2a3448; padding: 2px 8px; font-size: 11px; font-family: monospace; cursor: pointer; }
  #inspector-header button:hover { color: #ffee00; border-color: #ffee00; }
  #inspector-body { padding: 12px; }
  #inspector-body p { font-size: 11px; color: #557; line-height: 1.5; font-family: monospace; }

  /* Show-inspector tab — hugs the right edge of the canvas when collapsed.
     Small vertical tab; click reopens the panel. Only visible when collapsed. */
  #inspector-show-tab {
    position: absolute; top: 12px; right: 0; z-index: 10;
    display: none;
    writing-mode: vertical-rl; text-orientation: mixed;
    background: #1a2030; color: #779; border: 1px solid #2a3448; border-right: none;
    padding: 8px 4px; font-size: 10px; font-family: monospace; letter-spacing: 2px;
    cursor: pointer;
  }
  #inspector-show-tab:hover { color: #ffee00; border-color: #ffee00; }
  #editor-root.inspector-collapsed #inspector-show-tab { display: block; }
</style>
</head>
<body>
<div id="editor-root">
  <div id="toolbar">
    <h1>◆ OVERCHARGE</h1>

    <!-- Level workflow controls ─────────────────────────────────────── -->
    <label for="level-select">LEVEL</label>
    <select id="level-select" title="Switch level (warns on unsaved changes)"></select>
    <button id="btn-new"       title="New empty level">NEW</button>
    <button id="btn-duplicate" title="Duplicate current level">DUPLICATE</button>
    <button id="btn-generate" title="Generate a random level idea">🎲 GENERATE</button>
    <button id="btn-test" title="Test the current level in the game (opens new tab)">▶ TEST</button>
    <button id="btn-save" class="primary" title="Save current level (Ctrl+S)">💾 SAVE</button>
    <span id="save-flash"></span>
    <div class="divider"></div>

    <!-- Undo / Redo ─────────────────────────────────────────────────── -->
    <button id="btn-undo" title="Undo (Ctrl+Z)">↶ UNDO</button>
    <button id="btn-redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">↷ REDO</button>
    <div class="divider"></div>

    <!-- Tools ───────────────────────────────────────────────────────── -->
    <button data-tool="pointer" title="Pointer — click to select, drag to move (1)">🖱 Pointer</button>
    <button data-tool="select"  title="Select — marquee + shift-additive multi-select (2)">▤ Select</button>
    <button data-tool="place"   title="Place tile / asset (3)">▮ Place</button>
    <button data-tool="rect"    title="Rectangle — drag to fill a terrain block (6)">▬ Rect</button>
    <button data-tool="erase"   title="Erase tile / asset (4)">▢ Erase</button>
    <button data-tool="pan"     title="Pan camera (5)">✋ Pan</button>
    <div class="divider"></div>

    <!-- Layer ordering (visible only when a decoration is selected) ─── -->
    <button id="btn-layer-front" title="Bring to Front (Shift+])">⤒ Front</button>
    <button id="btn-layer-forward" title="Bring Forward (])">↑ Forward</button>
    <button id="btn-layer-backward" title="Send Backward ([)">↓ Backward</button>
    <button id="btn-layer-back" title="Send to Back (Shift+[)">⤓ Back</button>
    <button id="btn-rotate" title="Rotate selected decorations 90° CW (R). Shift+R = CCW.">↻ Rotate</button>
    <div class="divider"></div>

    <button id="zoom-out"   title="Zoom out (-)">−</button>
    <button id="zoom-reset" title="Reset zoom (0)">100%</button>
    <button id="zoom-in"    title="Zoom in (+)">+</button>
    <div class="divider"></div>

    <label><input type="checkbox" id="grid-toggle" checked> grid (G)</label>
    <label title="Authoring guards — reject floating/overlap placements">
      <input type="checkbox" id="guards-toggle"> guards
    </label>
    <label title="Magnetic edge snap — decoration placement abuts/aligns to same-family siblings within ±12px">
      <input type="checkbox" id="magnetic-toggle" checked> magnetic
    </label>
    <label title="Snap override for placement + drag. AUTO uses per-item defaults.">
      snap
      <select id="snap-select" style="min-width: 70px;">
        <option value="auto">AUTO</option>
        <option value="32">32</option>
        <option value="16">16</option>
        <option value="1">1</option>
      </select>
    </label>
    <div id="level-info">loading...</div>
  </div>
  <div id="asset-browser"></div>
  <div id="main-area">
    <canvas id="editor-canvas"></canvas>
    <!-- Vertical tab to re-open inspector when collapsed. Only visible in collapsed state. -->
    <button id="inspector-show-tab" title="Show Inspector (I)">▶ INSPECTOR</button>
  </div>
  <div id="inspector">
    <div id="inspector-header">
      <h3>INSPECTOR</h3>
      <button id="btn-inspector-hide" title="Hide Inspector (I)">◀ HIDE</button>
    </div>
    <div id="inspector-body">
      <p>Object properties will appear here.</p>
      <p style="margin-top: 12px; color: #446;">Phase 3.</p>
    </div>
  </div>
</div>

<!-- Generator modal — hidden until btn-generate opens it. Native <dialog>. -->
<dialog id="gen-dialog" style="background: #0f1420; color: #cdd; border: 1px solid #2a3448; padding: 18px 22px; font-family: monospace; min-width: 360px; position: relative;">
  <!-- Close X in the top-right corner. Native <dialog>.close() also fires
       on Esc key, but Chief wants an explicit visual close affordance. -->
  <button id="gen-close" type="button" title="Close (Esc)" aria-label="Close"
          style="position: absolute; top: 8px; right: 10px; background: transparent; border: none; color: #779; font-size: 18px; font-family: monospace; cursor: pointer; padding: 4px 8px; line-height: 1;">×</button>
  <h2 style="font-size: 14px; letter-spacing: 3px; color: #ffee00; margin-bottom: 14px;">🎲 GENERATE IDEA</h2>
  <div style="display: grid; grid-template-columns: 100px 1fr; gap: 8px 12px; align-items: center; font-size: 12px;">
    <label>STYLE</label>
    <select id="gen-style">
      <option>Balanced</option><option>Rooftops</option><option>Vertical</option>
      <option>Dense City</option><option>Sparse / Open</option>
    </select>
    <label>LENGTH</label>
    <select id="gen-length">
      <option>Short</option><option selected>Medium</option><option>Long</option>
    </select>
    <label>COMPLEXITY</label>
    <select id="gen-complexity">
      <option>Simple</option><option selected>Moderate</option><option>Complex</option>
    </select>
    <label>OPTIONS</label>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <label style="font-size: 11px;"><input type="checkbox" id="gen-props" checked> Props</label>
      <label style="font-size: 11px;"><input type="checkbox" id="gen-electrical" checked> Electrical Objects</label>
      <label style="font-size: 11px;"><input type="checkbox" id="gen-checkpoint"> Checkpoint</label>
      <label style="font-size: 11px;"><input type="checkbox" id="gen-enemies" disabled> Enemies (not yet)</label>
    </div>
    <label>SEED</label>
    <div style="display: flex; gap: 4px; align-items: center;">
      <input type="text" id="gen-seed" placeholder="random" style="flex: 1; background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 4px; font-family: monospace; font-size: 11px;" />
      <button id="gen-seed-copy" type="button" title="Copy seed" style="padding: 4px 8px;">COPY</button>
    </div>
  </div>
  <div style="display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end;">
    <button id="gen-cancel" type="button">CANCEL</button>
    <button id="gen-regenerate" type="button" title="New layout, same settings">🎲 REGENERATE</button>
    <button id="gen-go" type="button" class="primary" style="background: #223250; border: 1px solid #44ccff; color: #cceeff; padding: 4px 12px;">GENERATE</button>
  </div>
  <div id="gen-status" style="margin-top: 10px; font-size: 10px; color: #779;"></div>

</dialog>

<!-- Confirm-discard dialog — used by NEW / DUPLICATE / GENERATE / level-switch
     when the current level is dirty. Uses native <dialog> instead of
     window.confirm() so it can't be disabled by Chrome's popup-block chip. -->
<dialog id="confirm-dialog" style="background: #0f1420; color: #cdd; border: 1px solid #ff8800; padding: 18px 22px; font-family: monospace; min-width: 320px;">
  <h2 style="font-size: 13px; letter-spacing: 2px; color: #ff8800; margin-bottom: 10px;">⚠ UNSAVED CHANGES</h2>
  <p id="confirm-message" style="font-size: 12px; line-height: 1.5; color: #cdd; margin-bottom: 16px;">You have unsaved changes. Continue anyway?</p>
  <div style="display: flex; gap: 8px; justify-content: flex-end;">
    <button id="confirm-cancel" type="button">CANCEL</button>
    <button id="confirm-ok" type="button" style="background: #442200; border: 1px solid #ff8800; color: #ffcc88; padding: 4px 12px;">DISCARD & CONTINUE</button>
  </div>
</dialog>

<script type="module" src="editor/main.js"></script>
</body>
</html>
