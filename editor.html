<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OVERCHARGE — Editor</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23091526'/%3E%3Cpath d='M18 3 L8 18 L14 18 L12 29 L24 12 L17 12 Z' fill='%23ffee00' stroke='%23ff8800' stroke-width='0.5'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0d14; color: #cdd; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

  #editor-root { display: grid; grid-template-columns: 240px 1fr 260px; grid-template-rows: 40px 1fr; grid-template-areas: "toolbar toolbar toolbar" "sidebar main inspector"; height: 100vh; width: 100vw; }

  /* Toolbar */
  #toolbar { grid-area: toolbar; background: #0f1420; border-bottom: 1px solid #1c2436; display: flex; align-items: center; padding: 0 12px; gap: 12px; font-size: 12px; }
  #toolbar h1 { font-size: 13px; letter-spacing: 2px; color: #ffee00; margin-right: 12px; }
  #toolbar button { background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 4px 10px; cursor: pointer; font-size: 12px; font-family: monospace; }
  #toolbar button:hover:not(:disabled) { background: #26304a; }
  #toolbar button:disabled { opacity: 0.35; cursor: not-allowed; }
  #toolbar button.active { background: #ffee00; color: #0a0d14; border-color: #ffee00; font-weight: bold; }
  #toolbar button.primary { background: #223250; border-color: #44ccff; color: #cceeff; }
  #toolbar button.primary:hover:not(:disabled) { background: #2c4266; }
  #toolbar select { background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 4px 6px; font-size: 12px; font-family: monospace; min-width: 180px; }
  #toolbar .divider { width: 1px; height: 20px; background: #1c2436; }
  #toolbar label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #889; }
  #level-info { margin-left: auto; font-family: monospace; font-size: 11px; color: #779; }
  #save-flash { font-family: monospace; font-size: 11px; color: #44ff88; opacity: 0; transition: opacity .3s; margin-left: 8px; }
  #save-flash.show { opacity: 1; }
  #save-flash.err { color: #ff5566; }
  .dirty-star { color: #ff8800; margin-left: 4px; }

  /* Sidebar (asset browser) */
  #asset-browser { grid-area: sidebar; background: #0d1119; border-right: 1px solid #1c2436; overflow-y: auto; padding: 8px; }
  .ab-header h3 { font-size: 11px; letter-spacing: 2px; color: #557; padding: 4px 0 8px; }
  .ab-search { width: 100%; background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 6px; font-size: 12px; margin-bottom: 6px; font-family: monospace; }
  .ab-category { width: 100%; background: #1a2030; color: #cdd; border: 1px solid #2a3448; padding: 4px; font-size: 12px; margin-bottom: 6px; font-family: monospace; }
  .ab-status { font-size: 10px; color: #557; padding: 4px 0; }
  .ab-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
  .ab-cell { background: #131826; border: 1px solid #1c2436; padding: 4px; cursor: pointer; text-align: center; overflow: hidden; }
  .ab-cell:hover { border-color: #ffee00; }
  .ab-cell.selected { border-color: #ffee00; background: #1a1f0a; }
  .ab-thumb { width: 100%; height: 60px; object-fit: contain; image-rendering: pixelated; background: #0a0d14; }
  .ab-label { font-size: 9px; color: #779; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; font-family: monospace; }

  /* Main canvas */
  #main-area { grid-area: main; position: relative; overflow: hidden; background: #0a0d14; }
  #editor-canvas { display: block; width: 100%; height: 100%; }

  /* Inspector (Phase 3 placeholder) */
  #inspector { grid-area: inspector; background: #0d1119; border-left: 1px solid #1c2436; padding: 12px; overflow-y: auto; }
  #inspector h3 { font-size: 11px; letter-spacing: 2px; color: #557; padding-bottom: 8px; }
  #inspector p { font-size: 11px; color: #557; line-height: 1.5; font-family: monospace; }
</style>
</head>
<body>
<div id="editor-root">
  <div id="toolbar">
    <h1>◆ OVERCHARGE</h1>

    <!-- Level workflow controls ─────────────────────────────────────── -->
    <label for="level-select">LEVEL</label>
    <select id="level-select" title="Switch level (warns on unsaved changes)"></select>
    <button id="btn-new"       title="New empty level">NEW</button>
    <button id="btn-duplicate" title="Duplicate current level">DUPLICATE</button>
    <button id="btn-save" class="primary" title="Save current level (Ctrl+S)">💾 SAVE</button>
    <span id="save-flash"></span>
    <div class="divider"></div>

    <!-- Undo / Redo ─────────────────────────────────────────────────── -->
    <button id="btn-undo" title="Undo (Ctrl+Z)">↶ UNDO</button>
    <button id="btn-redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">↷ REDO</button>
    <div class="divider"></div>

    <!-- Tools ───────────────────────────────────────────────────────── -->
    <button data-tool="select" title="Select / marquee (1)">▤ Select</button>
    <button data-tool="place"  title="Place tile / asset (2)">▮ Place</button>
    <button data-tool="erase"  title="Erase tile / asset (3)">▢ Erase</button>
    <button data-tool="pan"    title="Pan camera (4)">✋ Pan</button>
    <div class="divider"></div>

    <button id="zoom-out"   title="Zoom out (-)">−</button>
    <button id="zoom-reset" title="Reset zoom (0)">100%</button>
    <button id="zoom-in"    title="Zoom in (+)">+</button>
    <div class="divider"></div>

    <label><input type="checkbox" id="grid-toggle" checked> grid (G)</label>
    <div id="level-info">loading...</div>
  </div>
  <div id="asset-browser"></div>
  <div id="main-area">
    <canvas id="editor-canvas"></canvas>
  </div>
  <div id="inspector">
    <h3>INSPECTOR</h3>
    <p>Object properties will appear here.</p>
    <p style="margin-top: 12px; color: #446;">Phase 3.</p>
  </div>
</div>
<script type="module" src="editor/main.js"></script>
</body>
</html>
